name: Fix site structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move site files to repository root
        run: |
          shopt -s dotglob
          cp -r joint-friendly-workout/* .
          rm -rf joint-friendly-workout

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix GitHub Pages site structure" || exit 0
          git push
